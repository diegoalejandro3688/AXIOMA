name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @axioma/contracts run build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm -r run lint

      - name: Build backend
        run: pnpm --filter @axioma/backend run build

  db-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: axioma
          POSTGRES_PASSWORD: axioma_ci_password
          POSTGRES_DB: axioma_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axioma -d axioma_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://axioma:axioma_ci_password@localhost:5432/axioma_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: apps/backend
        run: pnpm run prisma:generate

      - name: Apply migrations against empty database
        working-directory: apps/backend
        run: pnpm run prisma:migrate:deploy

      - name: Run seed (1st pass)
        working-directory: apps/backend
        run: pnpm run prisma:seed

      - name: Run seed again (idempotency check)
        working-directory: apps/backend
        run: pnpm run prisma:seed

      - name: Verify row count did not double (idempotency)
        working-directory: apps/backend
        run: pnpm run verify:curriculum-topic-count

      - name: Build backend
        working-directory: apps/backend
        run: pnpm run build

      - name: Start backend for AUTH gate (AUTH_IDENTITY_PROVIDER=stub, puerto 3000)
        working-directory: apps/backend
        env:
          AUTH_IDENTITY_PROVIDER: stub
          INTERNAL_OPS_KEY: ci-internal-ops-key
          PORT: 3000
        run: nohup node dist/main.js > backend-auth.log 2>&1 &

      - name: Wait for AUTH backend to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/health/live > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "El backend no respondió a tiempo"
          exit 1

      - name: Run AUTH gate (creation, session ownership, rate limiting)
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://axioma:axioma_ci_password@localhost:5432/axioma_ci?schema=public
        run: npx tsx scripts/verify-auth-gate.ts http://localhost:3000

      # Puerto e instancia nuevos: el límite de /auth/session (10/60s) es por
      # proceso (contador en memoria del ThrottlerModule) -- reusar el mismo
      # servidor haría que el gate de PRIVACY heredara el límite ya agotado
      # por el propio test de rate limiting del gate de AUTH.
      - name: Start backend for PRIVACY gate (AUTH_IDENTITY_PROVIDER=stub, puerto 3001)
        working-directory: apps/backend
        env:
          AUTH_IDENTITY_PROVIDER: stub
          INTERNAL_OPS_KEY: ci-internal-ops-key
          PORT: 3001
        run: nohup node dist/main.js > backend-privacy.log 2>&1 &

      - name: Wait for PRIVACY backend to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3001/health/live > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "El backend no respondió a tiempo"
          exit 1

      - name: Run PRIVACY gate (deletion, recovery via CLI, sweeps, session cleanup)
        working-directory: apps/backend
        env:
          # DATABASE_URL y AUTH_IDENTITY_PROVIDER son necesarias aquí porque el
          # script invoca src/cli/recover-account.ts como subproceso (hereda
          # process.env) -- no solo hace requests HTTP al backend en :3001.
          DATABASE_URL: postgresql://axioma:axioma_ci_password@localhost:5432/axioma_ci?schema=public
          AUTH_IDENTITY_PROVIDER: stub
          INTERNAL_OPS_KEY: ci-internal-ops-key
        run: npx tsx scripts/verify-privacy-gate.ts http://localhost:3001

      - name: Show backend logs on failure
        if: failure()
        working-directory: apps/backend
        run: |
          echo "--- backend-auth.log ---"; cat backend-auth.log || true
          echo "--- backend-privacy.log ---"; cat backend-privacy.log || true
