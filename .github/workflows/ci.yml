name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @axioma/contracts run build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm -r run lint

      - name: Build backend
        run: pnpm --filter @axioma/backend run build

  offline-outbox-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      # node:sqlite requiere Node 22.5+ -- ver ADR-0011. Job separado del
      # `build` principal (que sigue en Node 20) para no tener que subir la
      # versión de Node de todos los demás jobs solo por este gate.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @axioma/contracts run build

      - name: Run OFFLINE-OUTBOX gate (migraciones, repositorio, SQL real vía node:sqlite)
        working-directory: apps/mobile
        run: pnpm run verify:offline-outbox-gate

  db-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: axioma
          POSTGRES_PASSWORD: axioma_ci_password
          POSTGRES_DB: axioma_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axioma -d axioma_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://axioma:axioma_ci_password@localhost:5432/axioma_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # MinIO (S3-compatible) para el gate de OBJECT-STORAGE -- ver ADR-0010.
      # No se usa el bloque `services:` de GitHub Actions porque no permite
      # pasarle el argumento `server /data` que la imagen necesita para
      # arrancar (su CMD por defecto es solo `minio`, sin subcomando).
      - name: Start MinIO (S3-compatible object storage)
        run: >-
          docker run -d --name axioma-minio-ci -p 9000:9000
          -e MINIO_ROOT_USER=axioma -e MINIO_ROOT_PASSWORD=axioma_ci_password
          minio/minio:latest server /data

      - name: Wait for MinIO to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "MinIO no respondió a tiempo"
          exit 1

      - name: Generate Prisma Client
        working-directory: apps/backend
        run: pnpm run prisma:generate

      - name: Apply migrations against empty database
        working-directory: apps/backend
        run: pnpm run prisma:migrate:deploy

      - name: Run seed (1st pass)
        working-directory: apps/backend
        run: pnpm run prisma:seed

      - name: Run seed again (idempotency check)
        working-directory: apps/backend
        run: pnpm run prisma:seed

      - name: Verify row count did not double (idempotency)
        working-directory: apps/backend
        run: pnpm run verify:curriculum-topic-count

      - name: Build backend
        working-directory: apps/backend
        run: pnpm run build

      - name: Start backend for AUTH gate (AUTH_IDENTITY_PROVIDER=stub, puerto 3000)
        working-directory: apps/backend
        env:
          AUTH_IDENTITY_PROVIDER: stub
          INTERNAL_OPS_KEY: ci-internal-ops-key
          PORT: 3000
        run: nohup node dist/main.js > backend-auth.log 2>&1 &

      - name: Wait for AUTH backend to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/health/live > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "El backend no respondió a tiempo"
          exit 1

      - name: Run AUTH gate (creation, session ownership, rate limiting)
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://axioma:axioma_ci_password@localhost:5432/axioma_ci?schema=public
        run: npx tsx scripts/verify-auth-gate.ts http://localhost:3000

      # Puerto e instancia nuevos: el límite de /auth/session (10/60s) es por
      # proceso (contador en memoria del ThrottlerModule) -- reusar el mismo
      # servidor haría que el gate de PRIVACY heredara el límite ya agotado
      # por el propio test de rate limiting del gate de AUTH.
      - name: Start backend for PRIVACY gate (AUTH_IDENTITY_PROVIDER=stub, puerto 3001)
        working-directory: apps/backend
        env:
          AUTH_IDENTITY_PROVIDER: stub
          INTERNAL_OPS_KEY: ci-internal-ops-key
          PORT: 3001
        run: nohup node dist/main.js > backend-privacy.log 2>&1 &

      - name: Wait for PRIVACY backend to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3001/health/live > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "El backend no respondió a tiempo"
          exit 1

      - name: Run PRIVACY gate (deletion, recovery via CLI, sweeps, session cleanup)
        working-directory: apps/backend
        env:
          # DATABASE_URL y AUTH_IDENTITY_PROVIDER son necesarias aquí porque el
          # script invoca src/cli/recover-account.ts como subproceso (hereda
          # process.env) -- no solo hace requests HTTP al backend en :3001.
          DATABASE_URL: postgresql://axioma:axioma_ci_password@localhost:5432/axioma_ci?schema=public
          AUTH_IDENTITY_PROVIDER: stub
          INTERNAL_OPS_KEY: ci-internal-ops-key
        run: npx tsx scripts/verify-privacy-gate.ts http://localhost:3001

      # Puerto e instancia nuevos por el mismo motivo que el gate de PRIVACY
      # (ver comentario arriba): el límite de /auth/session es por proceso.
      - name: Start backend for ANALYTICS gate (AUTH_IDENTITY_PROVIDER=stub, puerto 3002)
        working-directory: apps/backend
        env:
          AUTH_IDENTITY_PROVIDER: stub
          INTERNAL_OPS_KEY: ci-internal-ops-key
          ANALYTICS_ACTOR_SECRET: ci-analytics-actor-secret
          PORT: 3002
        run: nohup node dist/main.js > backend-analytics.log 2>&1 &

      - name: Wait for ANALYTICS backend to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3002/health/live > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "El backend no respondió a tiempo"
          exit 1

      - name: Run ANALYTICS gate (outbox relay, idempotencia, validación de esquema, resumen)
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://axioma:axioma_ci_password@localhost:5432/axioma_ci?schema=public
          AUTH_IDENTITY_PROVIDER: stub
          INTERNAL_OPS_KEY: ci-internal-ops-key
          ANALYTICS_ACTOR_SECRET: ci-analytics-actor-secret
        run: npx tsx scripts/verify-analytics-gate.ts http://localhost:3002

      # Puerto e instancia nuevos por el mismo motivo que los gates anteriores.
      - name: Start backend for OBSERVABILITY gate (AUTH_IDENTITY_PROVIDER=stub, puerto 3003)
        working-directory: apps/backend
        env:
          AUTH_IDENTITY_PROVIDER: stub
          INTERNAL_OPS_KEY: ci-internal-ops-key
          ANALYTICS_ACTOR_SECRET: ci-analytics-actor-secret
          PORT: 3003
        run: nohup node dist/main.js > backend-observability.log 2>&1 &

      - name: Wait for OBSERVABILITY backend to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3003/health/live > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "El backend no respondió a tiempo"
          exit 1

      - name: Run OBSERVABILITY gate (correlación, filtro de excepciones, sanitización, serialización)
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://axioma:axioma_ci_password@localhost:5432/axioma_ci?schema=public
          AUTH_IDENTITY_PROVIDER: stub
          INTERNAL_OPS_KEY: ci-internal-ops-key
          ANALYTICS_ACTOR_SECRET: ci-analytics-actor-secret
        run: npx tsx scripts/verify-observability-gate.ts http://localhost:3003 backend-observability.log

      # Puerto e instancia nuevos por el mismo motivo que los gates anteriores.
      - name: Start backend for USER gate (AUTH_IDENTITY_PROVIDER=stub, puerto 3004)
        working-directory: apps/backend
        env:
          AUTH_IDENTITY_PROVIDER: stub
          INTERNAL_OPS_KEY: ci-internal-ops-key
          ANALYTICS_ACTOR_SECRET: ci-analytics-actor-secret
          PORT: 3004
        run: nohup node dist/main.js > backend-user.log 2>&1 &

      - name: Wait for USER backend to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3004/health/live > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "El backend no respondió a tiempo"
          exit 1

      - name: Run USER gate (perfil básico, concurrencia, eliminación al cierre)
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://axioma:axioma_ci_password@localhost:5432/axioma_ci?schema=public
          AUTH_IDENTITY_PROVIDER: stub
          INTERNAL_OPS_KEY: ci-internal-ops-key
          ANALYTICS_ACTOR_SECRET: ci-analytics-actor-secret
        run: npx tsx scripts/verify-user-gate.ts http://localhost:3004

      # Puerto e instancia nuevos por el mismo motivo que los gates anteriores.
      - name: Start backend for OBJECT-STORAGE gate (puerto 3005)
        working-directory: apps/backend
        env:
          AUTH_IDENTITY_PROVIDER: stub
          INTERNAL_OPS_KEY: ci-internal-ops-key
          ANALYTICS_ACTOR_SECRET: ci-analytics-actor-secret
          OBJECT_STORAGE_ENDPOINT: http://localhost:9000
          OBJECT_STORAGE_REGION: auto
          OBJECT_STORAGE_BUCKET: axioma-content-ci
          OBJECT_STORAGE_ACCESS_KEY_ID: axioma
          OBJECT_STORAGE_SECRET_ACCESS_KEY: axioma_ci_password
          OBJECT_STORAGE_MAX_FILE_SIZE_BYTES: 5242880
          OBJECT_STORAGE_MAX_WIDTH_PX: 4000
          OBJECT_STORAGE_MAX_HEIGHT_PX: 4000
          PORT: 3005
        run: nohup node dist/main.js > backend-object-storage.log 2>&1 &

      - name: Wait for OBJECT-STORAGE backend to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3005/health/live > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "El backend no respondió a tiempo"
          exit 1

      - name: Run OBJECT-STORAGE gate (validación, roundtrip firmado, expiración real)
        working-directory: apps/backend
        env:
          INTERNAL_OPS_KEY: ci-internal-ops-key
        run: npx tsx scripts/verify-object-storage-gate.ts http://localhost:3005

      - name: Seed EDUCATION content (recurso publicado + preguntas, sobre la unidad ya sembrada)
        working-directory: apps/backend
        run: pnpm run prisma:seed

      # Puerto e instancia nuevos por el mismo motivo que los gates anteriores.
      - name: Start backend for EDUCATION gate (puerto 3006)
        working-directory: apps/backend
        env:
          AUTH_IDENTITY_PROVIDER: stub
          INTERNAL_OPS_KEY: ci-internal-ops-key
          ANALYTICS_ACTOR_SECRET: ci-analytics-actor-secret
          PORT: 3006
        run: nohup node dist/main.js > backend-education.log 2>&1 &

      - name: Wait for EDUCATION backend to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3006/health/live > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "El backend no respondió a tiempo"
          exit 1

      - name: Run EDUCATION gate (invariante de materia, ciclos, huérfanos, UPDATE, isCorrect ausente)
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://axioma:axioma_ci_password@localhost:5432/axioma_ci?schema=public
        run: npx tsx scripts/verify-education-gate.ts http://localhost:3006

      - name: Show backend logs on failure
        if: failure()
        working-directory: apps/backend
        run: |
          echo "--- backend-auth.log ---"; cat backend-auth.log || true
          echo "--- backend-privacy.log ---"; cat backend-privacy.log || true
          echo "--- backend-analytics.log ---"; cat backend-analytics.log || true
          echo "--- backend-observability.log ---"; cat backend-observability.log || true
          echo "--- backend-user.log ---"; cat backend-user.log || true
          echo "--- backend-object-storage.log ---"; cat backend-object-storage.log || true
          echo "--- backend-education.log ---"; cat backend-education.log || true
