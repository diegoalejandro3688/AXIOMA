services:
  postgres:
    image: postgres:17-alpine
    container_name: axioma-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: axioma
      POSTGRES_PASSWORD: axioma_dev_password
      POSTGRES_DB: axioma_dev
    ports:
      - '5432:5432'
    volumes:
      - axioma_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U axioma -d axioma_dev']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  axioma_postgres_data:
