services:
  postgres:
    image: postgres:17-alpine
    container_name: axioma-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: axioma
      POSTGRES_PASSWORD: axioma_dev_password
      POSTGRES_DB: axioma_dev
    ports:
      - '5432:5432'
    volumes:
      - axioma_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U axioma -d axioma_dev']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Almacenamiento de objetos S3-compatible para desarrollo/CI -- ver
  # docs/adr/0010-almacenamiento-de-contenido.md. Cloudflare R2 (elegido en
  # el Decision Gate) NO se aprovisiona todavía; el código habla el mismo
  # protocolo S3 contra MinIO local, sin cambios, cuando eso se decida.
  minio:
    image: minio/minio:latest
    container_name: axioma-minio-dev
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9090"
    environment:
      MINIO_ROOT_USER: axioma
      MINIO_ROOT_PASSWORD: axioma_dev_password
    ports:
      - '9000:9000'
      - '9090:9090'
    volumes:
      - axioma_minio_data:/data

volumes:
  axioma_postgres_data:
  axioma_minio_data:
